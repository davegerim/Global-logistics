name: global_logistics_app
description: Global Logistics PLC — consignor & driver mobile client.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.1
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.0
  dio: ^5.8.0+1
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  geolocator: ^14.0.2
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  file_picker: ^10.0.0
  pdf: ^3.12.0
  printing: ^5.14.3
  qr_flutter: ^4.1.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/gl_logo.png
  remove_alpha_ios: true
